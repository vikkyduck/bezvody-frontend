# Платформа «Без Воды» на домене. Ставится ПОСЛЕ того, как A-запись поддомена
# показывает на 5.129.198.180 — иначе certbot не сможет подтвердить владение.
#
# Здесь только 80-й порт: строки про TLS допишет certbot сам
# (`certbot --nginx -d id.withoutwater.ru`), как он это сделал для остальных сайтов.
# Порт 8093 остаётся рабочим входом на случай, если с доменом что-то не так.
server {
    listen 80;
    listen [::]:80;
    server_name id.withoutwater.ru;

    root /opt/bezvody-front/public;

    # Клиент приносит агенту документы: отчёты и выгрузки бывают тяжёлыми.
    # С дефолтным 1 МБ nginx резал бы их своим 413 до того, как файл дойдёт
    # до приложения, — и человек видел бы ошибку без объяснения.
    # 110 МБ — это заявленные клиенту 100 плюс запас на служебные поля формы.
    client_max_body_size 110m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/x-tss-framed — это ответы серверных функций TanStack: вся
    # переписка окна уезжает именно ими. Без этой строки шестьдесят килобайт
    # разбора ехали к клиенту несжатыми на каждое сообщение.
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/x-tss-framed;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(fonts|img)/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { expires 7d; }
    location = /favicon.svg { expires 7d; }
    location = /robots.txt  { expires 1h; }

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Агент пишет 6-pager минутами — с дефолтными 60 секундами nginx
        # рвал бы соединение раньше, чем модель договорит.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
