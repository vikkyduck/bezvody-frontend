# Платформа «Без Воды» — фронтенд. Рендер серверный (SSR), поэтому HTML отдаёт
# не nginx, а node-процесс bezvody-front на 127.0.0.1:5050. Nginx берёт на себя
# только статику из public/ — она с хешами в именах и кешируется навсегда.
# Домена пока нет, поэтому вход по порту: http://5.129.198.180:8093/
server {
    listen 8093;
    listen [::]:8093;
    server_name _;

    root /opt/bezvody-front/public;

    # Клиент приносит агенту документы: отчёты и выгрузки бывают тяжёлыми.
    # С дефолтным 1 МБ nginx резал бы их своим 413 до того, как файл дойдёт
    # до приложения, — и человек видел бы ошибку без объяснения.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Собранные vite-ассеты: имя содержит хеш, старые версии живут вечно.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Шрифты и картинки лежат в public/ без хеша — кешируем скромнее.
    location ~ ^/(fonts|img)/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { expires 7d; }
    location = /favicon.svg { expires 7d; }
    location = /robots.txt  { expires 1h; }

    # Всё остальное — SSR.
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSR-стрим TanStack Start отдаёт HTML кусками: буферизация nginx
        # склеила бы их в одну паузу перед первым байтом.
        proxy_buffering off;
    }
}
