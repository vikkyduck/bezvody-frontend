# Include inside the HTTPS server block for nowater.tech.
# Report files live outside /opt/bezvody-front so application releases keep them.
include /etc/nginx/snippets/nowater-branding.conf;
location = /AI-radar/Avito/Goods/19-26.10.26 {
    alias /var/www/nowater-reports/avito-goods-19-26.10.26.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

location = /AI-radar/Avito/Goods/19-26.10.26/ {
    return 308 /AI-radar/Avito/Goods/19-26.10.26$is_args$args;
}

location = /AI-radar/Avito/Goods/27.10-02.11.26 {
    alias /var/www/nowater-reports/avito-goods-27.10-02.11.26.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

location = /AI-radar/Avito/Goods/27.10-02.11.26/ {
    return 308 /AI-radar/Avito/Goods/27.10-02.11.26$is_args$args;
}
