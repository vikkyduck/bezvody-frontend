# Include inside the HTTPS server block for nowater.tech.
# Report files live outside /opt/bezvody-front so application releases keep them.
include /etc/nginx/snippets/nowater-branding.conf;
location = /AI-radar/Avito/Goods/19-26.10.26 {
    alias /var/www/nowater-reports/avito-goods-19-26.10.26.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

location = /AI-radar/Avito/Goods/19-26.10.26/ {
    return 308 /AI-radar/Avito/Goods/19-26.10.26$is_args$args;
}

location = /AI-radar/Avito/Goods/27.10-02.11.26 {
    alias /var/www/nowater-reports/avito-goods-27.10-02.11.26.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

location = /AI-radar/Avito/Goods/27.10-02.11.26/ {
    return 308 /AI-radar/Avito/Goods/27.10-02.11.26$is_args$args;
}

# Еженедельные выпуски AI-радара Авито Товаров. Страницы кладет шлюз nowater-radar
# (deploy/radar_gateway.py, пользователь radar) без перезагрузки nginx. Точные адреса
# выше этого шаблона важнее: старые выпуски открываются, как раньше. Поисковикам
# страницы выпусков не показываются, по ссылке открываются.
location ~ "^/AI-radar/Avito/Goods/(\d\d\.\d\d-\d\d\.\d\d\.\d\d)$" {
    alias /var/www/nowater-reports/radar/avito-goods-$1.html;
    types { }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Robots-Tag "noindex, nofollow";
}

location ~ "^/AI-radar/Avito/Goods/(\d\d\.\d\d-\d\d\.\d\d\.\d\d)/$" {
    return 308 /AI-radar/Avito/Goods/$1$is_args$args;
}
